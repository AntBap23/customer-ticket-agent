<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support desk sign in · Qual AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#19233a;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:430px;background:white;border:1px solid #e1e5ef;border-radius:18px;padding:36px;box-shadow:0 15px 60px #18213a09}.logo{width:40px;height:40px;display:grid;place-items:center;background:#6857de;color:white;font-size:24px;font-weight:700;border-radius:12px}h1{font-size:27px;letter-spacing:-.04em;margin:24px 0 10px}p{color:#6b758a;line-height:1.65;font-size:15px}label{display:block;margin:20px 0 7px;font-size:14px}input,button{width:100%;font:inherit;border-radius:9px;padding:12px}input{border:1px solid #d6ddea}button{margin-top:24px;background:#5748d2;color:white;border:0;font-weight:600;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b2a6ff;outline-offset:2px}a{color:#5748d2;font-size:14px}.error{background:#fff0f0;color:#9e3549;border-radius:8px;padding:12px;font-size:14px;margin-top:20px}.foot{border-top:1px solid #e6e9f1;margin-top:24px;padding-top:20px;font-size:13px}[hidden]{display:none}</style></head><body><main><div class="logo">q</div><h1>Sign in to the support desk.</h1><p>Use your existing Qual AI email and password. Staff access is limited to approved support accounts.</p><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button id="submit">Sign in</button><div id="error" class="error" role="alert" hidden></div></form><p class="foot">Your credentials are verified by Qual AI. They are not saved by the support desk.</p><a href="https://qualitative-ai-studio.onrender.com/" rel="noreferrer">Return to Qual AI</a></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.hidden=true;try{const r=await fetch('/api/auth/sign-in',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to sign in.');document.getElementById('password').value='';location.assign('/');}catch(e){error.textContent=e.message;error.hidden=false;}finally{button.disabled=false;}};</script></body></html>
